<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Listing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="\static\create_form-styles.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <h1>Create Listing</h1>
      <p class="subtitle">Fill in the details below to submit your item.</p>

      <form
        id="listingForm"
        data-url="{{ url_for('marketplace.create_listing') }}"
        data-redirect="{{ url_for('index') }}"
      >
        <div class="form-row">
          <div class="form-group">
            <label for="listingTitle">Item name</label>
            <input
              type="text"
              id="listingTitle"
              name="title"
              placeholder="e.g. Vintage Camera"
              required
            />
          </div>
          <div class="form-group">
            <label for="listingCreator">Seller name</label>
            <input
              type="text"
              id="listingCreator"
              name="creator"
              placeholder="Your name"
              value="{{ current_user.username if current_user.is_authenticated else '' }}"
              required
              readonly
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="listingPrice">Price ($)</label>
            <input
              type="number"
              id="listingPrice"
              name="price"
              placeholder="0.00"
              min="0"
              step="0.01"
              required
            />
          </div>
          <div class="form-group">
            <label for="condition">Condition</label>
            <select id="condition" name="condition" required>
              <option value="">Select condition</option>
              <option value="New">New</option>
              <option value="Used">Used - Like New</option>
              <option value="Used">Used - Good</option>
              <option value="Used">Used - Fair</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            placeholder="Describe your item — condition details, dimensions, history…"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label>Photo</label>
          <div
            class="file-upload"
            onclick="document.getElementById('imageUpload').click()"
          >
            <div class="file-upload-icon">📷</div>
            <span class="file-upload-text"
              ><span>Click to upload</span> an image</span
            >
            <p class="file-name" id="fileName"></p>
            <input
              type="file"
              id="imageUpload"
              name="imageUpload"
              accept="image/*"
              required
            />
          </div>
        </div>

        <hr />

        <div class="actions">
          <button type="submit">Submit</button>
          <a href="{{ url_for('index') }}" class="cancel">Cancel</a>
        </div>
      </form>

      <p id="responseMessage"></p>

      {% if current_user.is_authenticated %}
      <p class="user-info">Logged in as {{ current_user.username }}</p>
      {% endif %}
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
