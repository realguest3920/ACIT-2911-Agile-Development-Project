<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Listing</title>
  </head>
  <body>
    <h1>Create a New Listing</h1>

    <form id="listingForm" action="{{ url_for('marketplace.create_listing') }}" method="POST" enctype="multipart/form-data">
      <input
        type="text"
        id="title"
        name="title"
        placeholder="Item Name"
        required
      /><br /><br />
      <input
        type="text"
        id="creator"
        name="creator"
        placeholder="Seller Name"
        required
      /><br /><br />
      <input
        type="number"
        id="price"
        name="price"
        placeholder="Price"
        required
      /><br /><br />

      <select id="condition" name="condition" required>
        <option value="">--Select Condition--</option>
        <option value="New">New</option>
        <option value="Used">Used</option></select
      ><br /><br />

      <textarea
        id="description"
        name="description"
        placeholder="Item Description"
        required
      ></textarea
      ><br /><br />
      <label for="imageUpload">Select an image:</label>
      <input type="file" id="imageUpload" name="imageUpload" accept="image/*" /><br /><br />
      <button type="submit">Create Listing</button>
      <a href="{{ url_for('index') }}">Cancel</a>
    </form>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}
  </body>
</html>
